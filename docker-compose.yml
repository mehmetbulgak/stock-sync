services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stocksync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_DB_USER: stocksync
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-stocksync}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d stocksync"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=stocksync;Username=stocksync;Password=${APP_DB_PASSWORD:-stocksync}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: ${SEED_DEMO_DATA:-true}
      ReverseProxy__Enabled: "true"
      ReverseProxy__KnownNetworks__0: 10.0.0.0/8
      ReverseProxy__KnownNetworks__1: 172.16.0.0/12
      ReverseProxy__KnownNetworks__2: 192.168.0.0/16
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  pgdata:
