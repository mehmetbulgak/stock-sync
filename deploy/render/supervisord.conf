[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/stocksync-supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /tmp/stocksync-postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:api]
command=/app/deploy/start-api.sh
directory=/app
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/usr/sbin/nginx -c /app/deploy/nginx.conf -g "daemon off;"
priority=30
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
